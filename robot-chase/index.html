<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robot Chase</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden;cursor:crosshair}
  #robot{position:fixed;left:0;top:0;width:160px;
         will-change:transform;pointer-events:none;
         filter:drop-shadow(0 12px 18px rgba(0,0,0,.6))}
</style>
<img id="robot" src="rc.png" alt="robot">
<script>
// spring-damper chase: a = k(target-p) - c*v  → smooth accel + settle, no overshoot at c≈2√k
const K = 40, C = 2 * Math.sqrt(40) * 0.75;   // tune: lower C = more overshoot/drift
const el = document.getElementById('robot');
let px = innerWidth / 2, py = innerHeight / 2, vx = 0, vy = 0;
let tx = px, ty = py, last = 0, ang = 0;   // ang: heading in rad, image-top = forward

const aim = e => { tx = e.clientX; ty = e.clientY; };
addEventListener('pointermove', aim);
addEventListener('touchmove', e => aim(e.touches[0]), {passive:true});

requestAnimationFrame(function frame(t){
  const dt = Math.min((t - last) / 1000, 0.05); last = t;   // clamp tab-switch jumps
  vx += (K * (tx - px) - C * vx) * dt;
  vy += (K * (ty - py) - C * vy) * dt;
  px += vx * dt; py += vy * dt;
  // point image-top at the cursor; ease the turn instead of snapping
  const dx = tx - px, dy = ty - py;
  if (dx * dx + dy * dy > 400) {                        // dead zone: 20px, else it spins
    const want = Math.atan2(dy, dx) + Math.PI / 2;
    let d = (want - ang + Math.PI) % (2 * Math.PI);     // shortest way round
    if (d < 0) d += 2 * Math.PI;
    ang += (d - Math.PI) * Math.min(1, 3 * dt);         // 3 = turn rate (higher = snappier)
  }
  el.style.transform = `translate(${px - el.width/2}px, ${py - el.height/2}px) rotate(${ang}rad)`;
  requestAnimationFrame(frame);
});
</script>
