<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>RoboChief</title>
  <meta name="description" content="RoboChief project page">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="RoboChief">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="RoboChief">
  <meta property="og:image" content="https://robochief.github.io/static/images/exploded.jpg" />
  <meta property="og:url" content="https://robochief.github.io" />
  <meta property="og:description" content="Project page for RoboChief" />

  <link href="https://fonts.googleapis.com/css?family=Google+Sans|Noto+Sans|Castoro" rel="stylesheet">

  <link rel="stylesheet" href="./static/css/bulma.min.css">
  <link rel="stylesheet" href="./static/css/bulma-carousel.min.css">
  <link rel="stylesheet" href="./static/css/bulma-slider.min.css">
  <link rel="stylesheet" href="./static/css/fontawesome.all.min.css">
  <link rel="stylesheet" href="./static/css/index.css">

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script defer src="./static/js/fontawesome.all.min.js"></script>
  <script src="./static/js/index.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./static/js/viewer.js"></script>
</head>

<body>

  <style>
    /* Scroll-driven showcase: the viewer is pinned while #scrolly scrolls past */
    #scrolly { height: 400vh; position: relative; }
    #scrolly .pin { position: sticky; top: 0; height: 100vh; overflow: hidden; }
    #viewer { position: absolute; inset: 0; }
    #scrolly .overlay { position: absolute; left: 0; right: 0; text-align: center; pointer-events: none; padding: 0 16px; }
    #scrolly .caption { bottom: 3rem; font-size: 1.5rem; opacity: 0; transition: opacity 0.4s; }
    #scrolly .caption.on { opacity: 1; }
    #hint { position: fixed; left: 0; right: 0; bottom: 1.5rem; text-align: center; font-size: 0.85rem; color: #888; pointer-events: none; z-index: 1; }
  </style>
  <section class="hero">
    <div class="hero-body">
      <div class="container is-max-desktop has-text-centered">
        <h1 class="title is-1 publication-title">RoboChief</h1>
        <div class="is-size-4 publication-authors">Page under construction</div>
        <div class="is-size-5 publication-authors">
          <span class="author-block">TU Dortmund</span> |
          <span class="author-block">Fraunhofer IML</span>
        </div>
      </div>
    </div>
  </section>

  <p id="hint">Scroll ↓</p>
  <section id="scrolly">
    <div class="pin">
      <div id="viewer" role="img" aria-label="3D model of RoboChief, rotating and exploding as you scroll"></div>
      <p class="overlay caption" data-from="0.2" data-to="0.5">Kiwi drive. Three omni wheels, 120° apart.</p>
      <p class="overlay caption" data-from="0.6" data-to="1.01">Inside: BLDC motors, two batteries, a LattePanda Mu.</p>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="content has-text-centered">
        <p>All rights reserved. TU Dortmund and Fraunhofer IML</p>
      </div>
    </div>
  </footer>

</body>

</html>
